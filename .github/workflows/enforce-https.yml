name: Enforce GitHub Pages HTTPS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  actions: write
  contents: read
  pages: write

jobs:
  enforce-https:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Enable HTTPS when the certificate is ready
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(gh api "repos/${REPOSITORY}/pages" --jq '.https_enforced')" != "true" ]]; then
            gh api \
              --method PUT \
              "repos/${REPOSITORY}/pages" \
              -F https_enforced=true
          fi

          gh api \
            --method PUT \
            "repos/${REPOSITORY}/actions/workflows/enforce-https.yml/disable"

          echo "HTTPS enforcement is enabled; scheduled retries are disabled."
